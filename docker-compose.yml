x-version: "3"

services:
  app:
    build: .
    image: lucas/saga-auth-proxy:0.2.0-dev
    container_name: saga-auth-proxy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-}
      - JWT_KID=${JWT_KID:-saga-1}
      - UPSTREAM_BASE_URL=${UPSTREAM_BASE_URL:-https://sistemas2.utfpr.edu.br}
      - UPSTREAM_FLOW_TIMEOUT=15
      - SESSION_TTL_SECONDS=3600
      - SESSION_INACTIVITY_TTL_SECONDS=900
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
      - HEARTBEAT_TTL_SECONDS=60
      - DATABASE_URL=postgresql://sa:sa-dev@postgres:5432/sa
      - REDIS_URL=redis://default@redis:6379/0
      - PORTAL_BASE_URL=${PORTAL_BASE_URL:-http://localhost:8000}
      - PORTAL_ALLOWED_REDIRECT_HOSTS=${PORTAL_ALLOWED_REDIRECT_HOSTS:-["localhost"]}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - saga_secrets:/run/secrets
      - ./logs:/app/logs

  # Infra compartilhada com sgoa e sgrf. A definição canônica está em
  # ../compose.dev.yml; aqui o compose do saga sobe a mesma dupla quando
  # rodado isolado.
  redis:
    image: redis:7-alpine
    container_name: sa-redis
    command: sh -c "redis-server --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru --aclfile /data/users.acl"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ../redis.acl:/data/users.acl:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sa-postgres
    environment:
      POSTGRES_DB: sa
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: sa-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sa_pgdata:/var/lib/postgresql/data
      - ./db:/db:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sa", "-d", "sa"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  schema:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: sa-dev
    entrypoint: >
      sh -c "psql -h postgres -U sa -d sa -v ON_ERROR_STOP=1 -f /db/schema.sql"
    volumes:
      - ./db:/db:ro

volumes:
  saga_secrets:
  sa_pgdata:
