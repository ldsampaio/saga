x-version: 3

services:
  app:
    build: .
    image: lucas/saga-auth-proxy:0.1.0-dev
    container_name: saga-auth-proxy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-}
      - UPSTREAM_BASE_URL=${UPSTREAM_BASE_URL:-https://sistemas2.utfpr.edu.br}
      - UPSTREAM_LOGIN_URL=${UPSTREAM_LOGIN_URL:-}
      - UPSTREAM_LOGOUT_URL=${UPSTREAM_LOGOUT_URL:-}
      - UPSTREAM_SCAN_URL=${UPSTREAM_SCAN_URL:-}
      - UPSTREAM_FLOW_TIMEOUT=15
      - SESSION_TTL_SECONDS=3600
      - SESSION_INACTIVITY_TTL_SECONDS=900
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - saga_secrets:/run/secrets

  redis:
    image: redis:7-alpine
    container_name: saga-redis
    command: >
      sh -c "redis-server --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  saga_secrets:
