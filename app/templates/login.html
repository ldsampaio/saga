{% extends "base.html" %}
{% block title %}Login — SAGA{% endblock %}
{% block content %}
<div class="card">
  <h1>SAGA</h1>
  <p class="sub">Login delegado ao sistemas2 (UTFPR). A senha é usada apenas nesta requisição e não é armazenada.</p>
  <form id="loginForm" novalidate>
    <div class="field">
      <label for="login">Login</label>
      <input id="login" name="login" type="text" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" id="submitBtn">Entrar</button>
    <p class="error" id="error"></p>
    <p class="state" id="state"></p>
  </form>
</div>
<script>
  const REDIRECT = {{ redirect | tojson }};
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const error = document.getElementById('error');
  const state = document.getElementById('state');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = { login: form.login.value, password: form.password.value };
    submitBtn.disabled = true;
    error.textContent = '';
    state.textContent = '';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        credentials: 'include',
      });

      if (res.status === 200) {
        const data = await res.json();
        const target = data.redirect || '/';
        window.location.href = REDIRECT ? `${target}?redirect=${encodeURIComponent(REDIRECT)}` : target;
        return;
      }
      if (res.status === 429) {
        state.textContent = 'Muitas tentativas. Aguarde e tente novamente.';
        return;
      }
      if (res.status === 503) {
        const data = await res.json().catch(() => ({}));
        window.location.href = '/error?code=' + encodeURIComponent(data.code || 'UPSTREAM_UNAVAILABLE');
        return;
      }
      const data = await res.json().catch(() => ({}));
      error.textContent = data.detail || 'Credenciais inválidas.';
    } catch (err) {
      state.textContent = 'Falha de conexão.';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
{% endblock %}
